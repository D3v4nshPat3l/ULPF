name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Score source packs
        run: cargo run --locked --quiet -- test --packs packs
      - name: Build release binary
        run: cargo build --release --locked
      - name: Exercise Parquet and pack-draft paths
        shell: bash
        run: |
          workdir="$(mktemp -d)"
          target/release/ulpf run \
            --packs packs \
            --vault "$workdir/vault" \
            --integrity-dir "$workdir/integrity" \
            --chain ci \
            --input testdata/mixed.log \
            --output "$workdir/events.ndjson" \
            --dead-letter "$workdir/dead-letter.ndjson" \
            --parquet "$workdir/events.parquet"
          test "$(head -c 4 "$workdir/events.parquet")" = "PAR1"
          test "$(tail -c 4 "$workdir/events.parquet")" = "PAR1"
          target/release/ulpf draft \
            --dead-letter "$workdir/dead-letter.ndjson" \
            --output "$workdir/candidates"
          test -f "$workdir/candidates/manifest.json"
