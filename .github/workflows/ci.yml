name: ULPF Air-Gapped CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # "Air-gapped" simulation: vendoring dependencies so build happens without network
    - name: Vendor dependencies
      run: cargo vendor

    - name: Configure Cargo for vendored sources
      run: |
        mkdir -p .cargo
        cat <<EOF > .cargo/config.toml
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF

    - name: Simulate network disconnect
      run: |
        sudo iptables -A OUTPUT -p tcp -m owner ! --uid-owner root -j DROP
        sudo iptables -A OUTPUT -p udp -m owner ! --uid-owner root -j DROP

    - name: Build
      run: cargo build --release

    - name: Test
      run: cargo test --workspace

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --workspace -- -D warnings
