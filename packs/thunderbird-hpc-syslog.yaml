# Thunderbird supercomputer syslog (Sandia National Laboratories).
#
# Written against the Loghub Thunderbird corpus (211,212,192 real lines — the
# largest public log corpus we are aware of, and the one used for throughput
# work at scale).
#
# Each line is a Loghub alert-label prefix followed by an ordinary RFC 3164
# syslog record. The pack strips the prefix with a regex and hands the syslog
# remainder to the syslog decoder, which is exactly the composition the decoder
# chain exists for.
identity:
  id: thunderbird-hpc-syslog
  vendor: Sandia National Laboratories
  product: Thunderbird HPC Cluster
  log_format: loghub-syslog
  priority: 115
  detect:
    # The shape of the record, not the daemons and nodes we happened to see.
    #
    # This used to key on `(pam_unix)` or `ntpd[` next to a list of node
    # prefixes (`/cn`, `/bn`, `/dn`). Both lists were incomplete in the
    # sampled corpus alone: crond, dhcpd, xinetd, snmpd, smartd and sshd2 are
    # missing from the first, and the `/en`, `/an` and `/#` nodes from the
    # second. Those 65 lines still counted as parsed only because the generic
    # syslog pack claimed them on a bare substring — which stopped being true
    # the moment that pack started matching the tag's shape properly, and took
    # this corpus from 97.80% to 96.75% with it.
    #
    # `loghub_syslog_prefix` is the structural version: a ten-digit epoch and
    # a dotted date, then an RFC 3164 record. It claims 99.55% of this corpus
    # and nothing in the other 3.2 million lines of `realdata` — including
    # BGL, which writes the same prefix but no syslog tag, and Squid, whose
    # URLs are exactly why the node-prefix list could not simply be extended.
    #
    # The old caution still holds and is why the prefix is required rather
    # than the tag alone: `(pam_unix)` by itself claimed 853 lines of the
    # Honeynet and Loghub Linux corpora and failed to extract them, dropping
    # those from 94% to 19%.
    - loghub_syslog_prefix: true
    # The header lines, which carry no tag at all: `- User ID: CentOS-4`,
    # `Kernel 2.6.9`, and the rest of the boot banner.
    - contains_all: ["tbird-"]

extract:
  - decoder: regex
    patterns:
      - '^(?P<label>\S+)\s+(?P<epoch>\d{10})\s+(?P<date>[\d.]+)\s+(?P<host>\S+)\s+(?P<body>.*)$'
  - decoder: regex
    optional: true
    patterns:
      - '(?P<component>\S+)\((?P<module>pam_unix)\)\[(?P<pid>\d+)\]:\s+session (?P<action>opened|closed) for user (?P<user>\S+)'
      - '(?P<component>[\w./-]+)\[(?P<pid>\d+)\]:\s+(?P<detail>.*)$'
      - '(?P<component>[\w./-]+):\s+(?P<detail>.*)$'

map:
  # A pack is not restricted to one event class. `pam_unix` lines are genuine
  # authentication events; the rest of the corpus is daemon chatter, and
  # calling all of it Authentication would be a lie the schema cannot catch.
  class_uid:
    from: module
    enum: tbird_class
    default: 6002                      # Application Lifecycle
  activity_id:
    from: action
    enum: tbird_action
    default: 0                         # Unknown
  severity_id: 1
  time:
    from: epoch
    format: epoch_s
  device.hostname:
    from: host
    observable: hostname
  actor.user.name:
    from: user
    observable: user
  app_name:
    from: component
  actor.process.pid:
    from: pid
    as: int
  auth_protocol:
    from: module
  unmapped.tbird_alert_label:
    from: label

enums:
  tbird_class:
    pam_unix: 3002                     # Authentication
  tbird_action:
    opened: 1                          # Logon
    closed: 2                          # Logoff

fixtures:
  - note: Real Loghub Thunderbird line - PAM session closed.
    raw: '- 1131566461 2005.11.09 dn228 Nov 9 12:01:01 dn228/dn228 crond(pam_unix)[2915]: session closed for user root'
    expect:
      class_uid: 3002
      activity_id: 2
      actor.user.name: root
      device.hostname: dn228
      actor.process.pid: 2915

  - note: Real Loghub Thunderbird line - PAM session opened.
    raw: '- 1131566461 2005.11.09 dn228 Nov 9 12:01:01 dn228/dn228 crond(pam_unix)[2915]: session opened for user root by (uid=0)'
    expect:
      class_uid: 3002
      activity_id: 1
      actor.user.name: root
