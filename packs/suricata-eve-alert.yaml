# Suricata EVE JSON alert logs.
#
# Suricata emits JSON-per-line (EVE format). Each record has an event_type
# field. This pack handles "alert" events and maps them to OCSF Detection
# Finding (2004), similar to Snort but from JSON rather than syslog text.
#
# Confirmed against real output: `chrissanders/packets`' `ek_to_cryptowall4`
# capture (genuine 2016 exploit-kit-to-ransomware traffic, a public GitHub
# capture, not self-generated) replayed through Suricata 8.0.6 with the real
# Emerging Threats Open ruleset (`suricata-update`, ~68,600 rules) —
#
#   suricata -r ek_to_cryptowall4.pcapng -l out/ -S out/rules/suricata.rules
#
# produced 5 real alerts and every field this pack maps — src/dst
# endpoints, protocol, severity, rule id, signature name — came out correct
# against the source JSON with no changes needed to the pack itself. Two of
# those alerts are the fixtures below, replacing hand-typed ones.
identity:
  id: suricata-eve-alert
  vendor: OISF
  product: Suricata
  log_format: json
  priority: 10
  detect:
    - contains_all: ['"event_type":"alert"', '"alert":{']
    - contains_all: ['"event_type": "alert"', '"alert": {']

extract:
  - decoder: json

map:
  class_uid: 2004                      # Detection Finding
  activity_id: 1                       # Create
  severity_id:
    from: alert.severity
    enum: suricata_severity
    default: 3
  time:
    from: timestamp
    format: rfc3339
  message:
    from: alert.signature
  finding_info.uid:
    from: alert.signature_id
  finding_info.title:
    from: alert.signature
  finding_info.analytic.name:
    from: alert.signature
  finding_info.analytic.uid:
    from: alert.signature_id
  finding_info.analytic.type_id: 1     # Rule
  is_alert: true
  src_endpoint.ip:
    from: src_ip
    observable: ip
  src_endpoint.port:
    from: src_port
    as: int
  dst_endpoint.ip:
    from: dest_ip
    observable: ip
  dst_endpoint.port:
    from: dest_port
    as: int
  connection_info.protocol_name:
    from: proto

enums:
  suricata_severity:
    "1": 5     # Critical
    "2": 4     # High
    "3": 3     # Medium
    "4": 2     # Low

fixtures:
  - note: >
      Real Suricata alert, from the real ek_to_cryptowall4 capture replayed
      through Suricata 8.0.6 with the real ET Open ruleset (see the pack
      header comment). Genuine 2016 exploit-kit HTTP traffic to a real
      malicious .top domain.
    raw: '{"timestamp":"2016-01-04T16:26:00.126782+0000","flow_id":1756756647993636,"pcap_cnt":38,"event_type":"alert","src_ip":"192.168.122.145","src_port":49328,"dest_ip":"45.32.238.202","dest_port":80,"proto":"TCP","ip_v":4,"pkt_src":"wire/pcap","metadata":{"flowbits":["ET.SuspExeTLDs"]},"tx_id":0,"alert":{"action":"allowed","gid":1,"signature_id":2023882,"rev":5,"signature":"ET INFO HTTP Request to a *.top domain","category":"Potentially Bad Traffic","severity":2,"metadata":{"confidence":["High"],"created_at":["2017_02_07"],"signature_severity":["Informational"],"updated_at":["2022_11_21"]}},"ts_progress":"request_complete","tc_progress":"response_complete","http":{"hostname":"xktzjm.topcentc.top","url":"/contrary/1653873/quite-someone-visitor-nonsense-tonight-sweet-await-gigantic-dance-third","http_method":"GET","protocol":"HTTP/1.1","status":200,"length":586},"app_proto":"http","direction":"to_server"}'
    expect:
      class_uid: 2004
      activity_id: 1
      severity_id: 4
      finding_info.uid: "2023882"
      finding_info.title: ET INFO HTTP Request to a *.top domain
      src_endpoint.ip: 192.168.122.145
      src_endpoint.port: 49328
      dst_endpoint.ip: 45.32.238.202
      dst_endpoint.port: 80
      connection_info.protocol_name: TCP

  - note: >
      Real Suricata alert from the same capture — the exploit-kit
      redirector rule (severity 1, the highest on Suricata's 1-4 scale)
      firing on the actual compromised-site response traffic.
    raw: '{"timestamp":"2016-01-04T16:25:54.239580+0000","flow_id":747514573842258,"event_type":"alert","src_ip":"113.20.11.49","src_port":80,"dest_ip":"192.168.122.145","dest_port":49314,"proto":"TCP","ip_v":4,"pkt_src":"stream (flow timeout)","tx_id":0,"alert":{"action":"allowed","gid":1,"signature_id":2022290,"rev":4,"signature":"ET EXPLOIT_KIT Evil Redirector Leading to EK Mon Dec 21 2015 5","category":"Exploit Kit Activity Detected","severity":1,"metadata":{"confidence":["High"],"created_at":["2015_12_21"],"signature_severity":["Major"],"updated_at":["2024_03_14"]}},"ts_progress":"request_complete","tc_progress":"response_complete","http":{"hostname":"www.sydneygroup.com.au","url":"/index.php/services","http_method":"GET","protocol":"HTTP/1.1","status":200,"length":16584},"app_proto":"http","direction":"to_client"}'
    expect:
      class_uid: 2004
      severity_id: 5
      finding_info.uid: "2022290"
      finding_info.title: ET EXPLOIT_KIT Evil Redirector Leading to EK Mon Dec 21 2015 5
      src_endpoint.ip: 113.20.11.49
      dst_endpoint.ip: 192.168.122.145
      dst_endpoint.port: 49314
      connection_info.protocol_name: TCP
