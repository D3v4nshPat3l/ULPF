# nginx access logs, default `combined` format.
#
# The edge web server ULPF did not previously cover — Apache was handled, nginx
# was not, and nginx sits in front of a large share of perimeter web estate as
# a reverse proxy and TLS terminator.
#
# Format: $remote_addr - $remote_user [$time_local] "$request" $status
#         $body_bytes_sent "$http_referer" "$http_user_agent"
identity:
  id: nginx-access
  vendor: F5
  product: nginx
  log_format: combined
  priority: 32
  detect:
    - contains_all: ["HTTP/"]
      contains_any: ["\" 200 ", "\" 404 ", "\" 301 ", "\" 302 ", "\" 403 ", "\" 500 ", "\" 499 "]
      contains_none: ["TCP_", "CEF:"]

extract:
  - decoder: regex
    patterns:
      - '^(?P<client>\S+)\s+\S+\s+(?P<user>\S+)\s+\[(?P<ts>[^\]]+)\]\s+"(?P<method>[A-Z]+)\s+(?P<path>\S+)\s+(?P<proto>[^"]+)"\s+(?P<status>\d{3})\s+(?P<bytes>\d+|-)\s+"(?P<referer>[^"]*)"\s+"(?P<agent>[^"]*)"'

map:
  class_uid: 4002                      # HTTP Activity
  activity_id:
    from: method
    enum: http_method
    default: 99
  severity_id:
    from: status
    enum: nginx_severity
    default: 1
  time:
    from: ts
    format: clf
  src_endpoint.ip:
    from: client
    observable: ip
  http_request.http_method:
    from: method
  http_request.url.path:
    from: path
  http_request.version:
    from: proto
  http_request.user_agent:
    from: agent
  http_request.referrer:
    from: referer
  http_response.code:
    from: status
    as: int
  traffic.bytes_out:
    from: bytes
    as: int
  actor.user.name:
    from: user
    observable: user

enums:
  http_method:
    CONNECT: 1
    DELETE: 2
    GET: 3
    HEAD: 4
    OPTIONS: 5
    POST: 6
    PUT: 7
    TRACE: 8
    PATCH: 9
  # 4xx and 5xx are worth surfacing above informational at the perimeter.
  nginx_severity:
    "400": 3
    "401": 4
    "403": 4
    "404": 3
    "500": 5
    "502": 5
    "503": 5

fixtures:
  - note: nginx combined-format GET.
    raw: '203.0.113.42 - - [22/Sep/2026:10:15:04 +0000] "GET /login HTTP/1.1" 200 4213 "https://example.com/" "Mozilla/5.0 (X11; Linux x86_64)"'
    expect:
      class_uid: 4002
      activity_id: 3
      src_endpoint.ip: 203.0.113.42
      http_response.code: 200
      traffic.bytes_out: 4213
      http_request.url.path: /login

  - note: nginx combined-format POST rejected with 403.
    raw: '198.51.100.7 - admin [22/Sep/2026:10:15:44 +0000] "POST /admin/config HTTP/1.1" 403 162 "-" "curl/8.4.0"'
    expect:
      class_uid: 4002
      activity_id: 6
      http_response.code: 403
      severity_id: 4
      actor.user.name: admin
