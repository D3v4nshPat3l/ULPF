# Generic Linux syslog host messages.
#
# Written against the Honeynet SotM34 /var/log/messages and the Loghub Linux
# corpus. Deliberately the lowest-priority pack: it is a catch-all for RFC 3164
# lines that no device-specific pack has claimed, so a host message becomes a
# searchable OCSF record instead of a dead letter.
identity:
  id: linux-syslog-host
  vendor: Linux
  product: syslog
  log_format: syslog-rfc3164
  priority: 800
  detect:
    # The shape of the tag, not a list of names. This comment used to say the
    # same thing above a list of seventeen names, which is how snmpd,
    # sm-msp-queue and every other daemon nobody thought of kept arriving as
    # fresh "needs a pack" clusters. RFC 3164 §4.1.3 defines the tag; that
    # definition does not grow, and a name list always will.
    - syslog_tag: true
    # Shapes that carry no RFC 3164 tag but are unmistakably this source.
    # `syslogd 1.4.1: restart.` puts a version between the name and the colon,
    # so it is not a tag by the RFC's definition however much it looks like
    # one; the daemon writing it is the syslog daemon itself.
    - contains_any: ["(pam_unix)", "su(", "sshd(", "syslogd "]

extract:
  - decoder: syslog

map:
  class_uid: 1008                      # Process Activity
  activity_id: 99
  severity_id:
    from: syslog.severity
    default: 1
  time:
    from: syslog.timestamp
    format: rfc3164
  device.hostname:
    from: syslog.hostname
    observable: hostname
  # The message text, not the program name. This read `syslog.appname`, so
  # every generically-parsed line had its message set to the daemon that
  # emitted it -- "snmpd" where the log said "Received SNMP packet(s) from
  # 67.170.148.126". The program name is still carried, on actor.process.name
  # below, which is where it belongs.
  message:
    from: syslog.body
  actor.process.name:
    from: syslog.appname
  actor.process.pid:
    from: syslog.procid
    as: int

fixtures:
  - note: Real SotM34 messages line.
    raw: 'Mar 13 04:10:10 combo su(pam_unix)[26013]: session opened for user news by (uid=0)'
    expect:
      class_uid: 1008
      device.hostname: combo

  - note: Real syslogd restart line.
    raw: 'Mar 13 04:05:02 combo syslogd 1.4.1: restart.'
    expect:
      class_uid: 1008
      device.hostname: combo
