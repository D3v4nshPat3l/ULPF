# Generic ArcSight CEF network events.
#
# CEF is a shared envelope rather than one vendor's format, so a single pack
# covers every appliance that speaks it — Check Point, Imperva, Trend Micro,
# Zscaler and others. Vendor-specific packs should carry a lower `priority`
# number so they are tried first; this one is the catch-all beneath them.
#
# Format reference: ArcSight Common Event Format (CEF) specification.
identity:
  id: generic-cef-network
  vendor: Generic
  product: CEF
  log_format: cef
  priority: 90                         # deliberately low: a fallback
  detect:
    - contains_all: ["CEF:"]

extract:
  - decoder: cef

map:
  class_uid: 4001
  activity_id:
    from: act
    enum: cef_action
    default: 6
  severity_id:
    from: cef.severity
    enum: cef_severity
    default: 1
  # CEF `rt` is epoch milliseconds. Devices that omit it fall back to receipt
  # time, which the pipeline records separately in metadata.logged_time.
  time:
    from: rt
    format: epoch_ms
  message:
    from: [msg, cef.name]
  src_endpoint.ip:
    from: [src, c6a2]
    observable: ip
  src_endpoint.port:
    from: spt
    as: int
  src_endpoint.hostname:
    from: shost
    observable: hostname
  dst_endpoint.ip:
    from: [dst, c6a3]
    observable: ip
  dst_endpoint.port:
    from: dpt
    as: int
  dst_endpoint.hostname:
    from: dhost
    observable: hostname
  connection_info.protocol_name:
    from: proto
  traffic.bytes_out:
    from: out
    as: int
  traffic.bytes_in:
    from: in
    as: int
  actor.user.name:
    from: [suser, duser]
    observable: user
  url.url_string:
    from: request
    observable: url
  device.vendor_name:
    from: cef.device_vendor
  device.product.name:
    from: cef.device_product
  device.product.version:
    from: cef.device_version

enums:
  cef_action:
    allow: 6
    permit: 6
    accept: 6
    block: 3
    blocked: 3
    deny: 3
    drop: 3
    reset: 3
  # CEF severity is 0-10; OCSF is 0-6. Collapse to the nearest band.
  cef_severity:
    "0": 1
    "1": 1
    "2": 1
    "3": 2
    "4": 2
    "5": 3
    "6": 3
    "7": 4
    "8": 4
    "9": 5
    "10": 5

fixtures:
  - note: >-
      A CEF sender with no specific pack. The fixture deliberately names a
      vendor no other pack claims: an earlier one used a Check Point line,
      which `checkpoint-firewall` claims first at priority 15, so this pack
      would never have seen it in a real library.
    raw: 'CEF:0|Contoso|EdgeSensor|4.2|4001|Traffic permitted|3|src=10.4.4.9 spt=51314 dst=203.0.113.77 dpt=443 proto=TCP act=permit'
    expect:
      class_uid: 4001
      src_endpoint.ip: 10.4.4.9
      dst_endpoint.ip: 203.0.113.77
      dst_endpoint.port: 443
