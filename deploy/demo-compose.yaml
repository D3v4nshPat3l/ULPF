# The whole demonstration, in one command.
#
#   docker compose -f deploy/demo-compose.yaml up -d --build
#
# Brings up ULPF and a single-node Wazuh stack together, already wired to each
# other, so a reviewer runs one command and has the comparison in front of them:
#
#   /dev  --[Wazuh]-->  Wazuh, raw vendor lines
#   /dev  --[ULPF]-->   ULPF -> normalized OCSF -> the same Wazuh index
#
# Before the first run, once per machine, generate the indexer certificates:
#
#   docker compose -f deploy/wazuh/generate-indexer-certs.yml run --rm generator
#
# Then:
#
#   ULPF console     http://127.0.0.1:8787
#   ULPF simulator   http://127.0.0.1:8787/dev
#   Wazuh dashboard  https://localhost      (admin / SecretPassword)
#
# In Wazuh, once: create the index pattern `wazuh-archives-*` with time field
# `timestamp`, then open Discover. Without it the dashboard shows nothing and
# it reads as no data having arrived. See docs/WAZUH_INTEGRATION.md.
#
# ---------------------------------------------------------------------------
# Why ULPF has no `ports:` of its own
#
# It runs inside the manager's network namespace. The simulator page's target
# switch sends to `127.0.0.1:514` for Wazuh and `127.0.0.1:5514` for ULPF, and
# in an ordinary container both of those are the container's own loopback --
# the Wazuh button would send into a port nothing is listening on, and the
# comparison would silently show one empty half.
#
# Sharing the namespace makes `127.0.0.1:514` genuinely the manager's syslog
# port and `127.0.0.1:5514` genuinely ULPF's own listener, so both buttons
# work with no change to the console. The cost is that ULPF's ports are
# published on `wazuh.manager` below, which is where they have to be declared.
# ---------------------------------------------------------------------------

services:
  ulpf:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ulpf:demo
    container_name: ulpf
    depends_on:
      - wazuh.manager
    # See the note above: ULPF shares the manager's network namespace so the
    # simulator's loopback targets resolve the way the console assumes.
    network_mode: "service:wazuh.manager"
    command:
      - serve
      - --packs=/app/packs
      - --vault=/app/data/vault
      - --integrity-dir=/app/data/integrity
      - --chain=demo
      - --datasets=/app/realdata
      - --host=0.0.0.0
      - --port=8787
      - --syslog-bind=0.0.0.0:5514
      # Every normalized event also goes to the manager's syslog port, which
      # is the leg that puts OCSF beside the raw lines in one Wazuh view.
      - --forward-udp=127.0.0.1:514
      # A reviewer opening the console should not have to find a token in a
      # container log. The port is published on loopback only.
      - --no-auth
    volumes:
      - ulpf-data:/app/data
      # The corpora the simulator replays. Read-only: the collector never
      # writes to them, and a demonstration should not be able to alter its
      # own evidence.
      - ../realdata:/app/realdata:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # SIGTERM signs a final checkpoint and closes any Parquet writers, which
    # is what writes their footers.
    stop_grace_period: 30s

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
      # ULPF's ports, declared here because it shares this namespace. Console
      # on loopback only: anyone who can reach it can approve a Source Pack,
      # and a Source Pack decides how every later record is interpreted.
      - "127.0.0.1:8787:8787"
      - "5514:5514/udp"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      # Mounted AFTER filebeat_etc so it wins over the named volume. Without
      # this the archives module stays off and nothing reaches
      # wazuh-archives-*, however the manager is configured.
      - ./wazuh/filebeat-archives.yml:/etc/filebeat/filebeat.yml
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 443:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

volumes:
  ulpf-data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
