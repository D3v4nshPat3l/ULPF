[package]
name = "ulpf-decode-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Not a workspace member: libfuzzer-sys needs nightly. The same "never
# panics" contract is enforced on stable by tests/no_panic.rs, which is what
# CI runs on every commit.
[dependencies]
libfuzzer-sys = "0.4"
ulpf-decode = { path = ".." }
ulpf-core = { path = "../../ulpf-core" }

[[bin]]
name = "decoder_fuzz"
path = "fuzz_targets/decoder_fuzz.rs"
test = false
doc = false
