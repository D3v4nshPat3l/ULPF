[package]
name = "ulpf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface for the Universal Log Pre-processing Framework"

[[bin]]
name = "ulpf"
path = "src/main.rs"

[dependencies]
ulpf-core = { workspace = true }
ulpf-ocsf = { workspace = true }
ulpf-vault = { workspace = true }
ulpf-decode = { workspace = true }
ulpf-pack = { workspace = true }
ulpf-generator = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# For `ulpf healthcheck` only. Already in the tree via ulpf-generator, so this
# adds a declaration rather than a dependency.
reqwest = { version = "0.13.4" }
notify = "8.2.0"
chrono = "0.4.45"
socket2 = "0.6.5"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "bench"
harness = false

