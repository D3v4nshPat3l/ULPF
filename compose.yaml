services:
  ulpf-console:
    build: .
    command: ["serve", "--packs", "/app/packs", "--vault", "/app/data/vault", "--integrity-dir", "/app/data/integrity", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ulpf-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  ulpf-data:
